<div id="ideo-container"></div>

<script>
  // 1) Helper to export the rendered SVG
  function exportIdeogramSVG(filename = 'ideogram.svg') {
    const svgEl = document.querySelector('#ideo-container svg');
    if (!svgEl) return console.error('No SVG found in #ideo-container');

    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');

    // Ensure it has a viewBox so the SVG is standalone
    if (!clone.getAttribute('viewBox')) {
      const bbox = svgEl.getBBox();
      clone.setAttribute('viewBox', `0 0 ${Math.ceil(bbox.width)} ${Math.ceil(bbox.height)}`);
    }

    const source = '<?xml version="1.0" encoding="UTF-8"?>\n' +
      new XMLSerializer().serializeToString(clone);

    const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
